name: Offline verification
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: ruff check src tests scripts app.py run.py
      - run: python -m pytest -q
      - run: python scripts/build_demo.py --baseline deliverables/PowerBI_Demo_Candidate --output "${{ runner.temp }}/evidence-bi-demo" --verification-output "${{ runner.temp }}/evidence-bi-demo-verification.json"
      - run: python scripts/validate_powerbi.py "${{ runner.temp }}/evidence-bi-demo"
