[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-bi-analyst"
version = "0.1.0"
description = "Evidence-traceable analytics with controlled LLM tools and Power BI exports"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<4", "pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]
ui = ["streamlit>=1.45,<2"]

[project.scripts]
bi-analyst = "bi_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
